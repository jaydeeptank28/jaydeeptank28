<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Jaydeep Tank, Full Stack Developer">
  <style>
    .name{font:700 60px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f4f1ea}
    .role{font:400 26px 'SFMono-Regular',Consolas,'Courier New',monospace;fill:#cfd8d6}
    .cur{fill:#e8a33d;animation:b 1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
    .in{animation:i .8s ease-out both}
    @keyframes i{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.cur,.in{animation:none}}
  </style>
  <rect width="1000" height="220" fill="#16363d"/>
  <rect x="60" y="48" width="56" height="6" fill="#e8a33d"/>
  <text class="name in" x="60" y="122">Jaydeep Tank</text>
  <text class="role in" x="60" y="166" style="animation-delay:.3s">Full Stack Developer</text>
  <rect class="cur" x="352" y="146" width="14" height="26"/>
</svg>
